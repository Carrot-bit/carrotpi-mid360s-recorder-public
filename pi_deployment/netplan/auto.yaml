# carrot-profile: auto
# Generate this locally with: sudo carrot-net create-auto
# It combines the existing protected home.yaml and field.yaml profiles.
# The field hotspot receives a higher NetworkManager autoconnect priority.
network:
  version: 2
  renderer: NetworkManager
  ethernets:
    eth0:
      addresses: [REPLACE_PI_ETH_IP/24]
      dhcp4: false
      dhcp6: false
      optional: true
  wifis:
    wlan0:
      dhcp4: true
      dhcp6: false
      optional: true
      access-points: {}
